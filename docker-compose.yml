services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    command: npm run start:dev
    environment:
      PORT: 3000
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AWS_REGION: eu-central-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_ENDPOINT: http://localstack:4566
      S3_HOT_BUCKET: epaka-hot
      S3_ARCHIVE_BUCKET: epaka-archive
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-epaka}
      DB_USER: ${DB_USER:-epaka}
      DB_PASSWORD: ${DB_PASSWORD:-epaka}
      DATABASE_URL: ${DATABASE_URL:-postgresql://${DB_USER:-epaka}:${DB_PASSWORD:-epaka}@${DB_HOST:-db}:${DB_PORT:-5432}/${DB_NAME:-epaka}}
    ports:
      - "3000:3000"
    volumes:
      - .:/usr/src/app
      - app_node_modules:/usr/src/app/node_modules
    depends_on:
      redis:
        condition: service_healthy
      localstack:
        condition: service_healthy
      db:
        condition: service_healthy

  redis:
    image: redis:8-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  localstack:
    image: localstack/localstack:4.4.0
    environment:
      SERVICES: s3
      AWS_DEFAULT_REGION: eu-central-1
      AWS_REGION: eu-central-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    ports:
      - "4566:4566"
    volumes:
      - localstack_data:/var/lib/localstack
      - ./docker/localstack/init.sh:/etc/localstack/init/ready.d/init.sh
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "awslocal s3api head-bucket --bucket epaka-hot && awslocal s3api head-bucket --bucket epaka-archive",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-epaka}
      POSTGRES_USER: ${DB_USER:-epaka}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-epaka}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  app_node_modules:
  redis_data:
  localstack_data:
  db_data:
