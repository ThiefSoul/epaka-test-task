services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    command: npm run start:dev
    environment:
      PORT: 3000
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AWS_REGION: eu-central-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_ENDPOINT: http://localstack:4566
      S3_HOT_BUCKET: epaka-hot
      S3_ARCHIVE_BUCKET: epaka-archive
    ports:
      - "3000:3000"
    volumes:
      - .:/usr/src/app
      - app_node_modules:/usr/src/app/node_modules
    depends_on:
      redis:
        condition: service_healthy
      localstack:
        condition: service_healthy

  redis:
    image: redis:8-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  localstack:
    image: localstack/localstack:4.4.0
    environment:
      SERVICES: s3
      AWS_DEFAULT_REGION: eu-central-1
      AWS_REGION: eu-central-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    ports:
      - "4566:4566"
    volumes:
      - localstack_data:/var/lib/localstack
      - ./docker/localstack/init.sh:/etc/localstack/init/ready.d/init.sh
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "awslocal s3api head-bucket --bucket epaka-hot && awslocal s3api head-bucket --bucket epaka-archive",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  app_node_modules:
  redis_data:
  localstack_data:
