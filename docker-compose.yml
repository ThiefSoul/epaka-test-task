services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    command: npm run start:dev
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    volumes:
      - .:/usr/src/app
      - app_node_modules:/usr/src/app/node_modules
    depends_on:
      redis:
        condition: service_healthy
      localstack:
        condition: service_healthy
      db:
        condition: service_healthy

  redis:
    image: redis:8-alpine
    command: redis-server --appendonly yes --port ${REDIS_PORT:-6379}
    ports:
      - "${REDIS_PORT:-6379}:${REDIS_PORT:-6379}"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "${REDIS_PORT:-6379}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  localstack:
    image: localstack/localstack:4.4.0
    environment:
      SERVICES: s3
      AWS_DEFAULT_REGION: ${AWS_REGION:-eu-central-1}
      AWS_REGION: ${AWS_REGION:-eu-central-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
      S3_HOT_BUCKET: ${S3_HOT_BUCKET:-epaka-hot}
      S3_ARCHIVE_BUCKET: ${S3_ARCHIVE_BUCKET:-epaka-archive}
    ports:
      - "4566:4566"
    volumes:
      - localstack_data:/var/lib/localstack
      - ./docker/localstack/init.sh:/etc/localstack/init/ready.d/init.sh
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "awslocal s3api head-bucket --bucket \"$${S3_HOT_BUCKET}\" && awslocal s3api head-bucket --bucket \"$${S3_ARCHIVE_BUCKET}\" && awslocal s3api head-bucket --bucket epaka-test-hot && awslocal s3api head-bucket --bucket epaka-test-archive",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  db:
    image: postgres:18-alpine
    command: postgres -p ${DB_PORT:-5432}
    environment:
      POSTGRES_DB: ${DB_NAME:-epaka}
      DB_TEST_NAME: ${DB_TEST_NAME:-epaka_test}
      POSTGRES_USER: ${DB_USER:-epaka}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-epaka}
      DB_PORT: ${DB_PORT:-5432}
    ports:
      - "${DB_PORT:-5432}:${DB_PORT:-5432}"
    volumes:
      - db_data:/var/lib/postgresql
      - ./docker/postgres/init-test-db.sh:/docker-entrypoint-initdb.d/init-test-db.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\" -p \"$${DB_PORT}\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  app_node_modules:
  redis_data:
  localstack_data:
  db_data:
